apiVersion: apps/v1
kind: Deployment
metadata: 
  name: predictive-maintenance-api
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: pred-main-api
  template:
    metadata:
      labels:
        app: pred-main-api
    spec:
      containers:
        - name: api
          image: predictive-maintenance-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: "INFO"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi