<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1780" viewBox="0 0 2200 1780"><defs><marker id="15803D" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#15803D"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="60" y="74.0" font-size="44" fill="#17202E" font-weight="700">State &amp; storage</text><text x="62" y="109.0" font-size="22" fill="#526174" font-weight="400">Где находятся версии, данные и состояние / что сохраняется, а что пересоздается</text><rect x="60" y="145" width="2080" height="230" rx="12" fill="#EFF6FF" stroke="#2563EB"/><text x="82" y="178.0" font-size="18" fill="#2563EB" font-weight="700">ВНЕ КЛАСТЕРА / ВЕРСИОНИРОВАННЫЕ ИСТОЧНИКИ</text><rect x="60" y="435" width="2080" height="520" rx="12" fill="#F0FDF4" stroke="#15803D"/><text x="82" y="468.0" font-size="18" fill="#15803D" font-weight="700">NAMESPACE: mlops / СЕРВИСЫ С PVC</text><rect x="60" y="1040" width="2080" height="300" rx="12" fill="#FFFBEB" stroke="#B45309"/><text x="82" y="1073.0" font-size="18" fill="#B45309" font-weight="700">RUNTIME / БЕЗ ОТДЕЛЬНОГО ПОСТОЯННОГО ТОМА</text><rect x="60" y="1410" width="2080" height="290" rx="12" fill="#F8FAFC" stroke="#64748B"/><text x="82" y="1443.0" font-size="18" fill="#64748B" font-weight="700">ГРАНИЦЫ СОХРАННОСТИ И ВОССТАНОВЛЕНИЯ</text><polyline points="390,665 390,755" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#15803D)"/><polyline points="1070,665 1070,755" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#15803D)"/><polyline points="1750,665 1750,755" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#15803D)"/><polyline points="1380,580 1410,580 1410,990 680,990 680,1100" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#15803D)"/><rect x="80" y="195" width="960" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="207" width="4" height="126" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="100" y="237.0" font-size="24" fill="#17202E" font-weight="700">Git repository / commit SHA</text><text x="100" y="268.0" font-size="18" fill="#526174" font-weight="400">Код, DAG, манифесты и DVC-указатель с MD5 датасета.</text><text x="100" y="292.3" font-size="18" fill="#526174" font-weight="400">CSV не хранится в Git; локальный bundle artifacts/ версионируется.</text><rect x="1100" y="195" width="960" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1100" y="207" width="4" height="126" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="1120" y="237.0" font-size="24" fill="#17202E" font-weight="700">GHCR / sha-&lt;commit&gt;</text><text x="1120" y="268.0" font-size="18" fill="#526174" font-weight="400">Образ приложения: код, зависимости, artifacts/ и указатель .dvc.</text><text x="1120" y="292.3" font-size="18" fill="#526174" font-weight="400">Без CSV, локального DVC-кеша и .env. Удаление kind не удаляет GHCR.</text><rect x="80" y="505" width="620" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="517" width="4" height="136" rx="2" fill="#15803D" stroke="#15803D"/><text x="100" y="547.0" font-size="24" fill="#17202E" font-weight="700">RustFS / S3</text><text x="100" y="578.0" font-size="18" fill="#526174" font-weight="400">Бакет pred-main-dvc хранит версии датасета.</text><text x="100" y="602.3" font-size="18" fill="#526174" font-weight="400">DVC связывает MD5 из Git с объектами в S3.</text><text x="100" y="626.6" font-size="18" fill="#526174" font-weight="400">Это не хранилище моделей MLflow.</text><rect x="760" y="505" width="620" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="760" y="517" width="4" height="136" rx="2" fill="#15803D" stroke="#15803D"/><text x="780" y="547.0" font-size="24" fill="#17202E" font-weight="700">MLflow / Tracking + Registry</text><text x="780" y="578.0" font-size="18" fill="#526174" font-weight="400">Runs, параметры, метрики и версии модели.</text><text x="780" y="602.3" font-size="18" fill="#526174" font-weight="400">Aliases champion/challenger — указатели на версии.</text><text x="780" y="626.6" font-size="18" fill="#526174" font-weight="400">Артефакты: модель, metadata, failure_cases.csv.</text><rect x="1440" y="505" width="620" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1440" y="517" width="4" height="136" rx="2" fill="#15803D" stroke="#15803D"/><text x="1460" y="547.0" font-size="24" fill="#17202E" font-weight="700">Airflow / metadata</text><text x="1460" y="578.0" font-size="18" fill="#526174" font-weight="400">Состояния DAG run и task instance, XCom, Variables.</text><text x="1460" y="602.3" font-size="18" fill="#526174" font-weight="400">pred_main_image также хранится в БД Airflow.</text><text x="1460" y="626.6" font-size="18" fill="#526174" font-weight="400">Код DAG доставляется отдельно через ConfigMap.</text><rect x="80" y="755" width="620" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="767" width="4" height="126" rx="2" fill="#15803D" stroke="#15803D"/><text x="100" y="797.0" font-size="24" fill="#17202E" font-weight="700">PVC rustfs-data / 2 Gi</text><text x="100" y="828.0" font-size="18" fill="#526174" font-weight="400">Mount: /data</text><text x="100" y="852.3" font-size="18" fill="#526174" font-weight="400">Данные бакетов и объектов RustFS.</text><rect x="760" y="755" width="620" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="760" y="767" width="4" height="126" rx="2" fill="#15803D" stroke="#15803D"/><text x="780" y="797.0" font-size="24" fill="#17202E" font-weight="700">PVC mlflow-data / 2 Gi</text><text x="780" y="828.0" font-size="18" fill="#526174" font-weight="400">SQLite: /mlflow/mlflow.db</text><text x="780" y="852.3" font-size="18" fill="#526174" font-weight="400">Модели и артефакты: /mlflow/artifacts.</text><rect x="1440" y="755" width="620" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1440" y="767" width="4" height="126" rx="2" fill="#15803D" stroke="#15803D"/><text x="1460" y="797.0" font-size="24" fill="#17202E" font-weight="700">PVC airflow-data / 1 Gi</text><text x="1460" y="828.0" font-size="18" fill="#526174" font-weight="400">SQLite: /opt/airflow/data/airflow.db</text><text x="1460" y="852.3" font-size="18" fill="#526174" font-weight="400">Не том для кода DAG и не том для файловых логов.</text><rect x="80" y="1100" width="620" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="1112" width="4" height="176" rx="2" fill="#B45309" stroke="#B45309"/><text x="100" y="1142.0" font-size="24" fill="#17202E" font-weight="700">API / память процесса</text><text x="100" y="1173.0" font-size="18" fill="#526174" font-weight="400">Каждый API-pod держит свою копию модели.</text><text x="100" y="1197.3" font-size="18" fill="#526174" font-weight="400">При старте: MLflow → champion → RAM.</text><text x="100" y="1221.6" font-size="18" fill="#526174" font-weight="400">Смена alias сама не обновляет работающий процесс.</text><text x="100" y="1245.9" font-size="18" fill="#526174" font-weight="400">Пересоздание pod требует повторной загрузки.</text><rect x="760" y="1100" width="620" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="760" y="1112" width="4" height="176" rx="2" fill="#B45309" stroke="#B45309"/><text x="780" y="1142.0" font-size="24" fill="#17202E" font-weight="700">Task pod / временные файлы</text><text x="780" y="1173.0" font-size="18" fill="#526174" font-weight="400">DVC pull: CSV + кеш внутри validate/train pod.</text><text x="780" y="1197.3" font-size="18" fill="#526174" font-weight="400">app.train также записывает локальный artifacts/.</text><text x="780" y="1221.6" font-size="18" fill="#526174" font-weight="400">Task pod удаляется после выполнения.</text><text x="780" y="1245.9" font-size="18" fill="#526174" font-weight="400">Сохраняемые результаты отправляются в MLflow.</text><rect x="1440" y="1100" width="620" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1440" y="1112" width="4" height="176" rx="2" fill="#B45309" stroke="#B45309"/><text x="1460" y="1142.0" font-size="24" fill="#17202E" font-weight="700">PostgreSQL / без PVC</text><text x="1460" y="1173.0" font-size="18" fill="#526174" font-weight="400">Журнал запросов и предсказаний: predictions.</text><text x="1460" y="1197.3" font-size="18" fill="#526174" font-weight="400">Постоянный volume в Deployment не подключен.</text><text x="1460" y="1221.6" font-size="18" fill="#526174" font-weight="400">При пересоздании pod сохранность БД</text><text x="1460" y="1245.9" font-size="18" fill="#526174" font-weight="400">текущая конфигурация не обеспечивает.</text><rect x="80" y="1470" width="620" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="1482" width="4" height="136" rx="2" fill="#15803D" stroke="#15803D"/><text x="100" y="1512.0" font-size="24" fill="#17202E" font-weight="700">Пересоздание pod</text><text x="100" y="1543.0" font-size="18" fill="#526174" font-weight="400">RustFS / MLflow / Airflow: данные остаются</text><text x="100" y="1567.3" font-size="18" fill="#526174" font-weight="400">при подключении того же сохраненного PVC.</text><text x="100" y="1591.6" font-size="18" fill="#526174" font-weight="400">API загружает модель заново из MLflow.</text><rect x="760" y="1470" width="620" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="760" y="1482" width="4" height="136" rx="2" fill="#B45309" stroke="#B45309"/><text x="780" y="1512.0" font-size="24" fill="#17202E" font-weight="700">Удаление kind-кластера</text><text x="780" y="1543.0" font-size="18" fill="#526174" font-weight="400">PVC в локальном узле не является резервной копией.</text><text x="780" y="1567.3" font-size="18" fill="#526174" font-weight="400">Внешний диск для данных в kind-config не задан.</text><text x="780" y="1591.6" font-size="18" fill="#526174" font-weight="400">Состояние сервисов нужно сохранять отдельно.</text><rect x="1440" y="1470" width="620" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1440" y="1482" width="4" height="136" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="1460" y="1512.0" font-size="24" fill="#17202E" font-weight="700">Новый клон репозитория</text><text x="1460" y="1543.0" font-size="18" fill="#526174" font-weight="400">Возвращает код и указатели, но не состояние PVC.</text><text x="1460" y="1567.3" font-size="18" fill="#526174" font-weight="400">Образы остаются в GHCR; CSV скачивается через DVC</text><text x="1460" y="1591.6" font-size="18" fill="#526174" font-weight="400">только при наличии объектов в доступном S3.</text><text x="82" y="1673.0" font-size="18" fill="#526174" font-weight="400">Три независимые версии: commit SHA кода / MD5 датасета / версия модели vN. Champion — изменяемый alias, не новый файл.</text><text x="60" y="1747.0" font-size="17" fill="#526174" font-weight="400">Схема отражает текущие манифесты. Подробности локального кеша, Secrets и мониторинга — в storage-map.md.</text><rect x="405" y="698" width="112.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="410" y="716.0" font-size="16" fill="#15803D" font-weight="400">volume mount</text><rect x="1085" y="698" width="112.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1090" y="716.0" font-size="16" fill="#15803D" font-weight="400">volume mount</text><rect x="1765" y="698" width="112.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1770" y="716.0" font-size="16" fill="#15803D" font-weight="400">volume mount</text><rect x="875" y="956" width="231.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="880" y="974.0" font-size="16" fill="#15803D" font-weight="400">load champion / при старте API</text></g></svg>