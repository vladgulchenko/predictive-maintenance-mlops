<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1780" viewBox="0 0 2200 1780"><defs><marker id="2563EB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#2563EB"/></marker><marker id="15803D" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#15803D"/></marker><marker id="0F766E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#0F766E"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="60" y="74.0" font-size="44" fill="#17202E" font-weight="700">Code delivery</text><text x="62" y="109.0" font-size="22" fill="#526174" font-weight="400">GitHub Actions / от изменения кода до проверенного API в kind</text><rect x="60" y="145" width="2080" height="225" rx="12" fill="#F8FAFC" stroke="#64748B"/><text x="82" y="178.0" font-size="18" fill="#64748B" font-weight="700">WORKFLOW: ci / .github/workflows/ci.yaml</text><rect x="60" y="440" width="2080" height="280" rx="12" fill="#EFF6FF" stroke="#2563EB"/><text x="82" y="473.0" font-size="18" fill="#2563EB" font-weight="700">GITHUB / TESTS, BUILD И REGISTRY</text><rect x="60" y="800" width="2080" height="590" rx="12" fill="#F8FAFC" stroke="#64748B"/><text x="82" y="833.0" font-size="18" fill="#64748B" font-weight="700">DEPLOY / SELF-HOSTED RUNNER</text><rect x="60" y="1445" width="2080" height="255" rx="12" fill="#F0FDF4" stroke="#15803D"/><text x="82" y="1478.0" font-size="18" fill="#15803D" font-weight="700">SMOKE CHECKS / API, БД И МОНИТОРИНГ</text><polyline points="600,370 600,490" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563EB)"/><polyline points="640,580 830,580" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563EB)"/><polyline points="1390,580 1580,580" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#0F766E)"/><polyline points="1110,670 1110,755 600,755 600,890" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#2563EB)"/><polyline points="2060,580 2110,580 2110,835 1360,835 1360,890" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#0F766E)"/><polyline points="640,965 830,965" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563EB)"/><polyline points="1390,965 1580,965" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563EB)"/><polyline points="1820,1040 1820,1095 345,1095 345,1150" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563EB)"/><polyline points="640,1240 830,1240" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563EB)"/><polyline points="1390,1240 1580,1240" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563EB)"/><polyline points="1820,1330 1820,1420" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#15803D)"/><rect x="80" y="195" width="620" height="145" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="207" width="4" height="121" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="100" y="237.0" font-size="24" fill="#17202E" font-weight="700">Pull request</text><text x="100" y="268.0" font-size="18" fill="#526174" font-weight="400">tests: Ruff + pytest с тестовым PostgreSQL.</text><text x="100" y="292.3" font-size="18" fill="#526174" font-weight="400">Build и deploy не выполняются.</text><rect x="760" y="195" width="620" height="145" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="760" y="207" width="4" height="121" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="780" y="237.0" font-size="24" fill="#17202E" font-weight="700">Push в main</text><text x="780" y="268.0" font-size="18" fill="#526174" font-weight="400">tests → build → образ в GHCR.</text><text x="780" y="292.3" font-size="18" fill="#526174" font-weight="400">Автоматического deploy нет.</text><rect x="1440" y="195" width="620" height="145" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1440" y="207" width="4" height="121" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="1460" y="237.0" font-size="24" fill="#17202E" font-weight="700">Run workflow / main</text><text x="1460" y="268.0" font-size="18" fill="#526174" font-weight="400">tests → build → deploy.</text><text x="1460" y="292.3" font-size="18" fill="#526174" font-weight="400">Запуск на другой ветке не разрешает build/deploy.</text><rect x="80" y="490" width="560" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="502" width="4" height="156" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="100" y="517.0" font-size="14" fill="#2563EB" font-weight="700">JOB / ubuntu-latest</text><text x="100" y="550.0" font-size="24" fill="#17202E" font-weight="700">tests</text><text x="100" y="581.0" font-size="18" fill="#526174" font-weight="400">uv sync --frozen</text><text x="100" y="605.3" font-size="18" fill="#526174" font-weight="400">Ruff + pytest</text><text x="100" y="629.6" font-size="18" fill="#526174" font-weight="400">PostgreSQL 16 / service container</text><rect x="830" y="490" width="560" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="830" y="502" width="4" height="156" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="850" y="517.0" font-size="14" fill="#2563EB" font-weight="700">JOB / ubuntu-latest / ТОЛЬКО MAIN</text><text x="850" y="550.0" font-size="24" fill="#17202E" font-weight="700">build</text><text x="850" y="581.0" font-size="18" fill="#526174" font-weight="400">Dockerfile + uv.lock → buildx</text><text x="850" y="605.3" font-size="18" fill="#526174" font-weight="400">Публикация: GITHUB_TOKEN / packages:write</text><text x="850" y="629.6" font-size="18" fill="#526174" font-weight="400">Кеш слоев: GitHub Actions</text><rect x="1580" y="490" width="480" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1580" y="502" width="4" height="156" rx="2" fill="#0F766E" stroke="#0F766E"/><text x="1600" y="517.0" font-size="14" fill="#0F766E" font-weight="700">АРТЕФАКТ СБОРКИ</text><text x="1600" y="550.0" font-size="24" fill="#17202E" font-weight="700">GHCR / SHA-образ</text><text x="1600" y="581.0" font-size="18" fill="#526174" font-weight="400">ghcr.io/&lt;owner&gt;/&lt;repo&gt;:sha-&lt;commit&gt;</text><text x="1600" y="605.3" font-size="18" fill="#526174" font-weight="400">Код + зависимости + artifacts + .dvc</text><text x="1600" y="629.6" font-size="18" fill="#526174" font-weight="400">Без CSV, .env и локальных ключей DVC</text><text x="82" y="869.0" font-size="18" fill="#526174" font-weight="400">Docker вне Kubernetes / network kind / Docker socket</text><text x="830" y="869.0" font-size="18" fill="#526174" font-weight="400">concurrency: deploy-kind / timeout: 20 min</text><rect x="80" y="890" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="902" width="4" height="126" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="100" y="932.0" font-size="24" fill="#17202E" font-weight="700">01 / Контекст кластера</text><text x="100" y="963.0" font-size="18" fill="#526174" font-weight="400">Checkout того же commit SHA.</text><text x="100" y="987.3" font-size="18" fill="#526174" font-weight="400">kind export kubeconfig --internal; kubectl get nodes.</text><rect x="830" y="890" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="830" y="902" width="4" height="126" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="850" y="932.0" font-size="24" fill="#17202E" font-weight="700">02 / Образ в узле kind</text><text x="850" y="963.0" font-size="18" fill="#526174" font-weight="400">docker pull $IMAGE → kind load docker-image.</text><text x="850" y="987.3" font-size="18" fill="#526174" font-weight="400">API и task pod смогут использовать этот образ.</text><rect x="1580" y="890" width="480" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1580" y="902" width="4" height="126" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="1600" y="932.0" font-size="24" fill="#17202E" font-weight="700">03 / Secret и PostgreSQL</text><text x="1600" y="963.0" font-size="18" fill="#526174" font-weight="400">GitHub DB_PASSWORD → pred-main-secrets.</text><text x="1600" y="987.3" font-size="18" fill="#526174" font-weight="400">apply postgres.yaml → rollout status.</text><rect x="80" y="1150" width="560" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="1162" width="4" height="156" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="100" y="1177.0" font-size="14" fill="#2563EB" font-weight="700">DEPLOYMENT / DEFAULT</text><text x="100" y="1210.0" font-size="24" fill="#17202E" font-weight="700">04 / API и Ingress</text><text x="100" y="1241.0" font-size="18" fill="#526174" font-weight="400">kubectl apply: k8s/ + ingress.yaml.</text><text x="100" y="1265.3" font-size="18" fill="#526174" font-weight="400">set image API=$IMAGE → rollout status.</text><text x="100" y="1289.6" font-size="18" fill="#526174" font-weight="400">Новые API-pod загружают текущий champion.</text><rect x="830" y="1150" width="560" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="830" y="1162" width="4" height="156" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="850" y="1177.0" font-size="14" fill="#2563EB" font-weight="700">AIRFLOW / НАСТРОЙКА, НЕ ЗАПУСК DAG</text><text x="850" y="1210.0" font-size="24" fill="#17202E" font-weight="700">05 / Мониторинг и DAG</text><text x="850" y="1241.0" font-size="18" fill="#526174" font-weight="400">ServiceMonitor + dashboard ConfigMap.</text><text x="850" y="1265.3" font-size="18" fill="#526174" font-weight="400">ConfigMap airflow-dags / файлы из dags/.</text><text x="850" y="1289.6" font-size="18" fill="#526174" font-weight="400">Airflow Variable: pred_main_image=$IMAGE.</text><rect x="1580" y="1150" width="480" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1580" y="1162" width="4" height="156" rx="2" fill="#15803D" stroke="#15803D"/><text x="1600" y="1177.0" font-size="14" fill="#15803D" font-weight="700">ПРОВЕРКА ПОСЛЕ DEPLOY</text><text x="1600" y="1210.0" font-size="24" fill="#17202E" font-weight="700">06 / Smoke</text><text x="1600" y="1241.0" font-size="18" fill="#526174" font-weight="400">Запросы из runner в сеть kind.</text><text x="1600" y="1265.3" font-size="18" fill="#526174" font-weight="400">NodePort :30080 + Host-заголовок</text><text x="1600" y="1289.6" font-size="18" fill="#526174" font-weight="400">→ Traefik → API / Grafana.</text><rect x="80" y="1495" width="620" height="130" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="1507" width="4" height="106" rx="2" fill="#15803D" stroke="#15803D"/><text x="100" y="1537.0" font-size="24" fill="#17202E" font-weight="700">API и загруженная модель</text><text x="100" y="1568.0" font-size="18" fill="#526174" font-weight="400">/health + /ready + POST /v1/predict.</text><text x="100" y="1592.3" font-size="18" fill="#526174" font-weight="400">model_version / score 0..1 / метрика model_info.</text><rect x="760" y="1495" width="620" height="130" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="760" y="1507" width="4" height="106" rx="2" fill="#15803D" stroke="#15803D"/><text x="780" y="1537.0" font-size="24" fill="#17202E" font-weight="700">Запись в PostgreSQL</text><text x="780" y="1568.0" font-size="18" fill="#526174" font-weight="400">request_id из ответа predict → SQL.</text><text x="780" y="1592.3" font-size="18" fill="#526174" font-weight="400">В таблице predictions ровно одна такая запись.</text><rect x="1440" y="1495" width="620" height="130" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1440" y="1507" width="4" height="106" rx="2" fill="#15803D" stroke="#15803D"/><text x="1460" y="1537.0" font-size="24" fill="#17202E" font-weight="700">Мониторинг</text><text x="1460" y="1568.0" font-size="18" fill="#526174" font-weight="400">ServiceMonitor + dashboard ConfigMap существуют.</text><text x="1460" y="1592.3" font-size="18" fill="#526174" font-weight="400">Grafana отвечает на /api/health.</text><text x="82" y="1668.0" font-size="18" fill="#B45309" font-weight="400">Ошибка deploy → diagnostics: pod, describe, logs, events и ошибки импорта DAG. Автоматического rollback нет.</text><text x="60" y="1738.0" font-size="18" fill="#526174" font-weight="400">До deploy: платформа поднята через up.sh, первый champion есть в MLflow, runner подключен, DB_PASSWORD задан.</text><text x="60" y="1766.0" font-size="16" fill="#526174" font-weight="400">Доставка кода не обучает модель и не запускает DAG. Цикл переобучения показан на отдельной схеме.</text><rect x="620" y="395" width="126.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="625" y="413.0" font-size="16" fill="#2563EB" font-weight="400">все три события</text><rect x="657" y="544" width="121.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="662" y="562.0" font-size="16" fill="#2563EB" font-weight="400">main + tests OK</text><rect x="1420" y="544" width="78.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1425" y="562.0" font-size="16" fill="#0F766E" font-weight="400">push SHA</text><rect x="635" y="722" width="350.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="640" y="740.0" font-size="16" fill="#2563EB" font-weight="400">только workflow_dispatch на main / needs: build</text><rect x="1735" y="802" width="153.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1740" y="820.0" font-size="16" fill="#0F766E" font-weight="400">docker pull из GHCR</text><rect x="935" y="1060" width="221.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="940" y="1078.0" font-size="16" fill="#2563EB" font-weight="400">после готовности PostgreSQL</text><rect x="1465" y="1396" width="181.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1470" y="1414.0" font-size="16" fill="#15803D" font-weight="400">HTTP / SQL / Kubernetes</text></g></svg>