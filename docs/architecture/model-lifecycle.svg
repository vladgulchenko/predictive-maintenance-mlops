<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1780" viewBox="0 0 2200 1780"><defs><marker id="2563EB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#2563EB"/></marker><marker id="15803D" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#15803D"/></marker><marker id="0F766E" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#0F766E"/></marker><marker id="B91C1C" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#B91C1C"/></marker><marker id="B45309" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#B45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="60" y="74.0" font-size="44" fill="#17202E" font-weight="700">Model lifecycle</text><text x="62" y="109.0" font-size="22" fill="#526174" font-weight="400">Airflow / от проверки выгрузки до модели, загруженной в API</text><rect x="60" y="145" width="2080" height="400" rx="12" fill="#F8FAFC" stroke="#64748B"/><text x="82" y="178.0" font-size="18" fill="#64748B" font-weight="700">DAG: pred_main_retrain / namespace: mlops</text><rect x="80" y="655" width="620" height="815" rx="12" fill="#FEF2F2" stroke="#B91C1C"/><text x="102" y="688.0" font-size="18" fill="#B91C1C" font-weight="700">01 / ДАННЫЕ НЕ ПРОШЛИ ПРОВЕРКУ</text><rect x="760" y="655" width="620" height="815" rx="12" fill="#FFFBEB" stroke="#B45309"/><text x="782" y="688.0" font-size="18" fill="#B45309" font-weight="700">02 / КАНДИДАТ НЕ ПРОШЕЛ ГЕЙТ</text><rect x="1440" y="655" width="620" height="815" rx="12" fill="#F0FDF4" stroke="#15803D"/><text x="1462" y="688.0" font-size="18" fill="#15803D" font-weight="700">03 / КАНДИДАТ ПРОШЕЛ ГЕЙТ</text><polyline points="400,310 480,310" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2563EB)"/><polyline points="900,310 980,310" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#15803D)"/><polyline points="1500,310 1600,310" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#15803D)"/><polyline points="690,410 690,580 650,580 650,715" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#B91C1C)"/><polyline points="1700,410 1700,580 1320,580 1320,715" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#B45309)"/><polyline points="1950,410 1950,610 2000,610 2000,715" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#15803D)"/><polyline points="390,890 390,955" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#B91C1C)"/><polyline points="390,1105 390,1170" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#B91C1C)"/><polyline points="1070,890 1070,955" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#B45309)"/><polyline points="1070,1105 1070,1170" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#B45309)"/><polyline points="1750,890 1750,955" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#15803D)"/><polyline points="1750,1105 1750,1170" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#15803D)"/><rect x="80" y="210" width="320" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="222" width="4" height="176" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="100" y="237.0" font-size="14" fill="#2563EB" font-weight="700">TRIGGER</text><text x="100" y="270.0" font-size="24" fill="#17202E" font-weight="700">Запуск DAG</text><text x="100" y="301.0" font-size="18" fill="#526174" font-weight="400">Вручную: UI + параметры</text><text x="100" y="325.3" font-size="18" fill="#526174" font-weight="400">По расписанию: 03:00 Минск</text><text x="100" y="349.6" font-size="18" fill="#526174" font-weight="400">Один активный запуск</text><rect x="480" y="210" width="420" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="480" y="222" width="4" height="176" rx="2" fill="#15803D" stroke="#15803D"/><text x="500" y="237.0" font-size="14" fill="#15803D" font-weight="700">TASK / ОТДЕЛЬНЫЙ POD</text><text x="500" y="270.0" font-size="24" fill="#17202E" font-weight="700">validate</text><text x="500" y="301.0" font-size="18" fill="#526174" font-weight="400">DVC pull / remote cluster</text><text x="500" y="325.3" font-size="18" fill="#526174" font-weight="400">Pandera: строки + выгрузка</text><text x="500" y="349.6" font-size="18" fill="#526174" font-weight="400">MLflow: valid + data_md5</text><rect x="980" y="210" width="520" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="980" y="222" width="4" height="176" rx="2" fill="#15803D" stroke="#15803D"/><text x="1000" y="237.0" font-size="14" fill="#15803D" font-weight="700">TASK / ОТДЕЛЬНЫЙ POD</text><text x="1000" y="270.0" font-size="24" fill="#17202E" font-weight="700">train</text><text x="1000" y="301.0" font-size="18" fill="#526174" font-weight="400">DVC pull → fit → метрики</text><text x="1000" y="325.3" font-size="18" fill="#526174" font-weight="400">Registry: версия vN; challenger → vN</text><text x="1000" y="349.6" font-size="18" fill="#526174" font-weight="400">Сравнение и смена champion — здесь</text><rect x="1600" y="210" width="460" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1600" y="222" width="4" height="176" rx="2" fill="#15803D" stroke="#15803D"/><text x="1620" y="237.0" font-size="14" fill="#15803D" font-weight="700">TASK / УСЛОВИЕ ПРОДОЛЖЕНИЯ</text><text x="1620" y="270.0" font-size="24" fill="#17202E" font-weight="700">promoted</text><text x="1620" y="301.0" font-size="18" fill="#526174" font-weight="400">Читает флаг из XCom train</text><text x="1620" y="325.3" font-size="18" fill="#526174" font-weight="400">ShortCircuit: true / false</text><text x="1620" y="349.6" font-size="18" fill="#526174" font-weight="400">Не пересчитывает метрики</text><text x="82" y="468.0" font-size="18" fill="#526174" font-weight="400">validate и train используют один SHA-образ из pred_main_image.</text><text x="82" y="499.0" font-size="18" fill="#526174" font-weight="400">Каждый pod самостоятельно скачивает данные из RustFS через DVC.</text><rect x="980" y="430" width="520" height="105" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1000" y="458.0" font-size="20" fill="#15803D" font-weight="700">Гейт внутри train:</text><text x="1000" y="485.0" font-size="20" fill="#15803D" font-weight="700">PR-AUC кандидата &gt; PR-AUC champion + 0.005</text><text x="1000" y="513.0" font-size="16" fill="#526174" font-weight="400">Порог по умолчанию; нет champion → продвигаем.</text><rect x="110" y="715" width="560" height="175" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="110" y="727" width="4" height="151" rx="2" fill="#B91C1C" stroke="#B91C1C"/><text x="130" y="757.0" font-size="24" fill="#17202E" font-weight="700">validate: FAILED</text><text x="130" y="788.0" font-size="18" fill="#526174" font-weight="400">CSV читается, но значения нарушают схему.</text><text x="130" y="812.3" font-size="18" fill="#526174" font-weight="400">MLflow: valid=false + failure_cases.csv.</text><text x="130" y="836.6" font-size="18" fill="#526174" font-weight="400">app.validate завершает процесс с кодом 1.</text><rect x="110" y="955" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="110" y="967" width="4" height="126" rx="2" fill="#B91C1C" stroke="#B91C1C"/><text x="130" y="997.0" font-size="24" fill="#17202E" font-weight="700">Обучение не запускается</text><text x="130" y="1028.0" font-size="18" fill="#526174" font-weight="400">train / promoted / rollout: upstream_failed.</text><text x="130" y="1052.3" font-size="18" fill="#526174" font-weight="400">До регистрации новой модели дело не доходит.</text><rect x="110" y="1170" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="110" y="1182" width="4" height="126" rx="2" fill="#B91C1C" stroke="#B91C1C"/><text x="130" y="1212.0" font-size="24" fill="#17202E" font-weight="700">API остается на прежней модели</text><text x="130" y="1243.0" font-size="18" fill="#526174" font-weight="400">Работающий сервис не использует плохой CSV.</text><text x="130" y="1267.3" font-size="18" fill="#526174" font-weight="400">Champion и Deployment не меняются.</text><text x="112" y="1380.0" font-size="20" fill="#B91C1C" font-weight="700">Восстановление данных:</text><text x="112" y="1415.0" font-size="18" fill="#526174" font-weight="400">git revert → dvc checkout → deploy</text><text x="112" y="1439.3" font-size="18" fill="#526174" font-weight="400">Затем новый запуск DAG на хорошей версии.</text><rect x="790" y="715" width="560" height="175" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="790" y="727" width="4" height="151" rx="2" fill="#B45309" stroke="#B45309"/><text x="810" y="757.0" font-size="24" fill="#17202E" font-weight="700">promoted: false</text><text x="810" y="788.0" font-size="18" fill="#526174" font-weight="400">train уже сохранил метрики и версию vN.</text><text x="810" y="812.3" font-size="18" fill="#526174" font-weight="400">Challenger указывает на кандидата.</text><text x="810" y="836.6" font-size="18" fill="#526174" font-weight="400">Champion остался прежним.</text><rect x="790" y="955" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="790" y="967" width="4" height="126" rx="2" fill="#B45309" stroke="#B45309"/><text x="810" y="997.0" font-size="24" fill="#17202E" font-weight="700">rollout: SKIPPED</text><text x="810" y="1028.0" font-size="18" fill="#526174" font-weight="400">promoted выполняется успешно, возвращает false</text><text x="810" y="1052.3" font-size="18" fill="#526174" font-weight="400">и пропускает rollout. DAG: SUCCESS.</text><rect x="790" y="1170" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="790" y="1182" width="4" height="126" rx="2" fill="#B45309" stroke="#B45309"/><text x="810" y="1212.0" font-size="24" fill="#17202E" font-weight="700">API остается на прежней модели</text><text x="810" y="1243.0" font-size="18" fill="#526174" font-weight="400">Rolling restart не инициируется.</text><text x="810" y="1267.3" font-size="18" fill="#526174" font-weight="400">В MLflow кандидат доступен для сравнения.</text><text x="792" y="1380.0" font-size="20" fill="#B45309" font-weight="700">Это штатная работа гейта.</text><text x="792" y="1415.0" font-size="18" fill="#526174" font-weight="400">Повтор на тех же данных и параметрах</text><text x="792" y="1439.3" font-size="18" fill="#526174" font-weight="400">не обязан давать улучшение метрики.</text><rect x="1470" y="715" width="560" height="175" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1470" y="727" width="4" height="151" rx="2" fill="#15803D" stroke="#15803D"/><text x="1490" y="757.0" font-size="24" fill="#17202E" font-weight="700">promoted: true</text><text x="1490" y="788.0" font-size="18" fill="#526174" font-weight="400">train уже назначил champion → vN.</text><text x="1490" y="812.3" font-size="18" fill="#526174" font-weight="400">Результат передан через XCom.</text><text x="1490" y="836.6" font-size="18" fill="#526174" font-weight="400">promoted разрешает выполнить rollout.</text><rect x="1470" y="955" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1470" y="967" width="4" height="126" rx="2" fill="#15803D" stroke="#15803D"/><text x="1490" y="997.0" font-size="24" fill="#17202E" font-weight="700">rollout: SUCCESS</text><text x="1490" y="1028.0" font-size="18" fill="#526174" font-weight="400">PATCH аннотации Deployment запускает</text><text x="1490" y="1052.3" font-size="18" fill="#526174" font-weight="400">rolling restart API. Готовности pod задача не ждет.</text><rect x="1470" y="1170" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1470" y="1182" width="4" height="126" rx="2" fill="#15803D" stroke="#15803D"/><text x="1490" y="1212.0" font-size="24" fill="#17202E" font-weight="700">Новые API-pod загружают vN</text><text x="1490" y="1243.0" font-size="18" fill="#526174" font-weight="400">При старте: MLflow → champion → модель в памяти.</text><text x="1490" y="1267.3" font-size="18" fill="#526174" font-weight="400">После readiness pod принимает запросы.</text><text x="1472" y="1380.0" font-size="20" fill="#15803D" font-weight="700">Проверяем фактический выкат:</text><text x="1472" y="1415.0" font-size="18" fill="#526174" font-weight="400">kubectl rollout status + /health + Grafana.</text><text x="1472" y="1439.3" font-size="18" fill="#526174" font-weight="400">Alias в Registry не доказывает загрузку в API.</text><text x="60" y="1528.0" font-size="18" fill="#526174" font-weight="700">ЧЕМ ПОДТВЕРЖДАЕМ РЕЗУЛЬТАТ</text><rect x="80" y="1560" width="620" height="120" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="80" y="1572" width="4" height="96" rx="2" fill="#2563EB" stroke="#2563EB"/><text x="100" y="1602.0" font-size="24" fill="#17202E" font-weight="700">Airflow</text><text x="100" y="1633.0" font-size="18" fill="#526174" font-weight="400">Статусы задач и логи конкретного DAG run.</text><rect x="760" y="1560" width="620" height="120" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="760" y="1572" width="4" height="96" rx="2" fill="#15803D" stroke="#15803D"/><text x="780" y="1602.0" font-size="24" fill="#17202E" font-weight="700">MLflow</text><text x="780" y="1633.0" font-size="18" fill="#526174" font-weight="400">valid / ошибки · параметры · PR-AUC · aliases.</text><rect x="1440" y="1560" width="620" height="120" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1440" y="1572" width="4" height="96" rx="2" fill="#0F766E" stroke="#0F766E"/><text x="1460" y="1602.0" font-size="24" fill="#17202E" font-weight="700">Grafana + Locust</text><text x="1460" y="1633.0" font-size="18" fill="#526174" font-weight="400">Версия в pod · трафик · задержки · HTTP failures.</text><text x="60" y="1733.0" font-size="18" fill="#526174" font-weight="400">Для проверки обновления под нагрузкой Locust запускается до DAG и работает до готовности новой версии.</text><text x="60" y="1761.0" font-size="16" fill="#526174" font-weight="400">Схема показывает штатные сценарии; ошибки инфраструктуры или обучения разбираются отдельно по логам.</text><rect x="909" y="273" width="47.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="914" y="291.0" font-size="16" fill="#15803D" font-weight="400">exit 0</text><rect x="1513" y="273" width="52.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1518" y="291.0" font-size="16" fill="#15803D" font-weight="400">XCom</text><rect x="480" y="550" width="118.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="485" y="568.0" font-size="16" fill="#B91C1C" font-weight="400">Pandera / exit 1</text><rect x="1365" y="550" width="130.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1370" y="568.0" font-size="16" fill="#B45309" font-weight="400">promoted = false</text><rect x="1765" y="580" width="126.0" height="27" rx="3" fill="#FFFFFF" stroke="#FFFFFF"/><text x="1770" y="598.0" font-size="16" fill="#15803D" font-weight="400">promoted = true</text></g></svg>