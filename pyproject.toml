[project]
name = "predictive-maintenance-service"
version ="0.1.0"
description = "ML service for equipment failure risk prediction"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "pandas",
    "scikit-learn>=1.9,<1.10",
    "joblib",
    "psycopg[binary]",
    "mlflow>=3,<4",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
    "pre-commit",
    "pytest",
    "httpx",
    "ruff",
    "dvc[s3]>=3.67.1",
    "locust>=2.46.7",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
