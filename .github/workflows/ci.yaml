name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: predictive_maintenance}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/predictive_maintenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.12.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind}
    timeout-minutes: 10
    permissions: {contents: read, packages: read}
    env:
      KIND_CLUSTER: pred-main-mlops

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: runner info
        run: |
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "kind_cluster=$KIND_CLUSTER"

      - name: kind, kubectl and cluster access
        run: |
          B="$HOME/.local/bin"
          mkdir -p "$B"
          echo "$B" >> "$GITHUB_PATH"
          [ -x "$B/kind" ] || curl -sSLo "$B/kind" https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          [ -x "$B/kubectl" ] || curl -sSLo "$B/kubectl" https://dl.k8s.io/v1.37.0/bin/linux/amd64/kubectl
          chmod +x "$B/kind" "$B/kubectl"
          "$B/kind" export kubeconfig --name "$KIND_CLUSTER" --internal
          "$B/kubectl" get nodes

      - name: load image into kind
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: apply secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic pred-main-secrets \
          --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
          --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/predictive_maintenance" \
          --dry-run=client -o yaml | kubectl apply -f -
      
      - name: database
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s
      
      - name: service
        run: |
          kubectl apply -f k8s/
          kubectl apply -f platform/ingress.yaml
          kubectl set image deploy/predictive-maintenance-api api="$IMAGE"
          kubectl rollout status deploy/predictive-maintenance-api --timeout=120s

      - name: smoke
        run: |
          U="http://$KIND_CLUSTER-control-plane:30080"
          H="Host: pred-main.localhost"

          curl --fail -s --retry 10 --retry-all-errors -H "$H" "$U/health" | tee health.json
          echo
          
          curl --fail -s --retry 10 --retry-all-errors -H "$H" "$U/ready" | tee ready.json
          echo

          python3 -c "import json; h=json.load(open('health.json')); assert 'predictive-maintenance:v' in h['model_version'] and h['model_version'].endswith('@champion'), h"

          curl --fail -s --retry 5 --retry-all-errors -X POST "$U/v1/predict" \
            -H "$H" \
            -H "Content-Type: application/json" \
            -d @good.json | tee pred.json
          echo

          python3 -c "import json; r=json.load(open('pred.json')); assert 0 <= r['score'] <= 1, r"

          RID=$(python3 -c "import json; print(json.load(open('pred.json'))['request_id'])")

          sleep 2

          kubectl exec deploy/postgres -- psql -U postgres -d predictive_maintenance \
            -tAc "SELECT count(*) FROM predictions WHERE request_id = '$RID'" | grep -qx 1


      - name: diagnostics
        if: failure()

        run: |
          kubectl get pods -A -o wide
          kubectl get ingress -A
          kubectl describe deploy/predictive-maintenance-api | tail -40
          kubectl describe deploy/postgres | tail -40
          kubectl logs deploy/predictive-maintenance-api --tail=80 || true
          kubectl logs deploy/postgres --tail=80 || true
          kubectl get events --sort-by=.lastTimestamp | tail -80
