name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.12.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
